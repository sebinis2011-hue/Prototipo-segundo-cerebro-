      "</div>";
  }
  function applySlashBlock(key) {
    var note = getActiveNote();
    if (!note || !state.slashMenu.open) return;
    var pos = state.slashMenu.triggerPos;
    var content = note.content;
    var before = content.slice(0, pos);
    var afterSlash = content.slice(pos + 1);
    var templates = {
      h1: ["# ", ""], h2: ["## ", ""], h3: ["### ", ""],
      bullet: ["- ", ""], numbered: ["1. ", ""], todo: ["- [ ] ", ""],
      quote: ["> ", ""], divider: ["---\n", ""], code: ["```\n", "\n```"],
      link: ["[[", "nombre de la nota]]"], embed: ["![[", "nombre de la nota]]"],
      media: ["", "https://enlace-a-imagen-o-video"]
    };
    var pair = templates[key] || ["", ""];
    var insertText = pair[0] + pair[1];
    note.content = before + insertText + afterSlash;
    note.updatedAt = Date.now();
    saveNotes();
    state.slashMenu.open = false;
    render();
    requestAnimationFrame(function () {
      var t = document.getElementById("content-textarea");
      if (!t) return;
      t.focus();
      if (key === "link" || key === "embed") {
        var s1 = before.length + pair[0].length;
        t.setSelectionRange(s1, s1 + "nombre de la nota".length);
      } else if (key === "media") {
        t.setSelectionRange(before.length, before.length + "https://enlace-a-imagen-o-video".length);
      } else {
        var c1 = before.length + insertText.length;
        t.setSelectionRange(c1, c1);
      }
    });
  }

  function toggleTodo(ownerId, lineIndex) {
    var note = state.notes.find(function (n) { return n.id === ownerId; });
    if (!note) return;
    var lines = note.content.split("\n");
    if (lineIndex < 0 || lineIndex >= lines.length) return;
    var m = lines[lineIndex].match(/^(\s*[-*]\s\[)([ xX])(\]\s.*)$/);
    if (!m) return;
    lines[lineIndex] = m[1] + (m[2].toLowerCase() === "x" ? " " : "x") + m[3];
    note.content = lines.join("\n");
    note.updatedAt = Date.now();
    saveNotes();
    render();
  }

  function toast(msg) {
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.style.opacity = "1"; });
    setTimeout(function () {
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 300);
    }, 1700);
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function noteLinkFor(id) { return location.origin + location.pathname + "#/note/" + encodeURIComponent(id); }
  function noteAsMarkdown(note) { return "# " + note.title + "\n\n" + note.content + "\n"; }
  function exportVaultMarkdown() {
    var md = state.notes.slice().sort(function (a, b) { return a.title.localeCompare(b.title); })
      .map(function (n) { return "# " + n.title + "\n" + noteLinkFor(n.id) + "\n\n" + n.content + "\n"; })
      .join("\n---\n\n");
    var blob = new Blob([md], { type: "text/markdown" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "segundo-cerebro-vault-" + new Date().toISOString().slice(0, 10) + ".md";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- tree / breadcrumb ---------- */
  function buildTree() {
    var byParent = {};
    state.notes.forEach(function (n) {
      var pid = n.parentId || "__root__";
      if (!byParent[pid]) byParent[pid] = [];
      byParent[pid].push(n);
    });
    Object.keys(byParent).forEach(function (k) { byParent[k].sort(function (a, b) { return b.updatedAt - a.updatedAt; }); });
    function build(pid) {
      var kids = byParent[pid] || [];
      return kids.map(function (n) { return { note: n, children: build(n.id) }; });
    }
    return build("__root__");
  }
  function getBreadcrumb(note) {
    var chain = [], current = note, guard = 0;
    while (current && guard < 20) {
      chain.unshift(current);
      current = current.parentId ? state.notes.find(function (n) { return n.id === current.parentId; }) : null;
      guard++;
    }
    return chain;
  }

  /* ---------- vault analysis (cálculo puro, sin IA) ---------- */
  function computeVaultStats() {
    var notes = state.notes;
    var idByTitle = {};
    notes.forEach(function (n) { idByTitle[n.title.toLowerCase()] = n.id; });
    var links = [], seen = {};
    notes.forEach(function (n) {
      extractWikilinks(n.content).forEach(function (t) {
        var tid = idByTitle[t.toLowerCase()];
        if (tid && tid !== n.id) {
          var k = [n.id, tid].sort().join("|");
          if (!seen[k]) { seen[k] = true; links.push([n.id, tid]); }
        }
      });
    });
    var degree = {};
    links.forEach(function (l) { degree[l[0]] = (degree[l[0]] || 0) + 1; degree[l[1]] = (degree[l[1]] || 0) + 1; });
    var totalWords = notes.reduce(function (sum, n) { return sum + (n.content.trim() ? n.content.trim().split(/\s+/).length : 0); }, 0);
    var tagCounts = {};
    notes.forEach(function (n) { extractTags(n.content).forEach(function (t) { tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
    var topTags = Object.keys(tagCounts).map(function (t) { return { tag: t, count: tagCounts[t] }; }).sort(function (a, b) { return b.count - a.count; }).slice(0, 5);
    var ranked = notes.map(function (n) { return { note: n, degree: degree[n.id] || 0 }; }).sort(function (a, b) { return b.degree - a.degree; });
    var topConnected = ranked.filter(function (r) { return r.degree > 0; }).slice(0, 5);
    var orphans = notes.filter(function (n) { return (degree[n.id] || 0) === 0; });
    var suggestions = [];
    for (var i = 0; i < notes.length && suggestions.length < 5; i++) {
      for (var j = i + 1; j < notes.length && suggestions.length < 5; j++) {
        var a = notes[i], b = notes[j];
        var key = [a.id, b.id].sort().join("|");
        if (seen[key]) continue;
        var shared = extractTags(a.content).filter(function (t) { return extractTags(b.content).indexOf(t) !== -1; });
        if (shared.length > 0) suggestions.push({ a: a, b: b, sharedTags: shared });
      }
    }
    return { totalNotes: notes.length, totalWords: totalWords, totalLinks: links.length, topTags: topTags, topConnected: topConnected, orphans: orphans, suggestions: suggestions };
  }

  function analysisHTML() {
    var s = computeVaultStats();
    var html = '<div class="assist-card"><div class="assist-label">📊 Estado del vault</div><div class="stat-grid">' +
      '<div class="stat-box"><div class="stat-num">' + s.totalNotes + '</div><div class="stat-label">notas</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + s.totalWords + '</div><div class="stat-label">palabras</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + s.totalLinks + '</div><div class="stat-label">conexiones</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + s.orphans.length + '</div><div class="stat-label">huérfanas</div></div>' +
      "</div></div>";
    if (s.topConnected.length) {
      html += '<div class="assist-card"><div class="assist-label">🏆 Notas más conectadas</div>' +
        s.topConnected.map(function (r) { return '<div class="backlink-item" data-action="select-note" data-id="' + r.note.id + '">' + esc(r.note.icon || "📄") + " " + esc(r.note.title) + ' <span class="assist-muted">· ' + r.degree + " enlace" + (r.degree === 1 ? "" : "s") + "</span></div>"; }).join("") +
        "</div>";
    }
    if (s.topTags.length) {
      html += '<div class="assist-card"><div class="assist-label">🏷️ Etiquetas más usadas</div>' +
        s.topTags.map(function (t) { return '<span class="context-tag">#' + esc(t.tag) + " · " + t.count + "</span>"; }).join("") +
        "</div>";
    }
    if (s.orphans.length) {
      html += '<div class="assist-card"><div class="assist-label">🧩 Notas huérfanas (sin conexiones)</div>' +
        s.orphans.slice(0, 6).map(function (n) { return '<div class="backlink-item" data-action="select-note" data-id="' + n.id + '">' + esc(n.icon || "📄") + " " + esc(n.title) + "</div>"; }).join("") +
        "</div>";
    }
    if (s.suggestions.length) {
      html += '<div class="assist-card"><div class="assist-label">💡 Conexiones sugeridas (comparten etiqueta, no enlazadas)</div>' +
        s.suggestions.map(function (sg) {
          return '<div class="suggestion-row"><span class="assist-muted">' + esc(sg.a.title) + " ↔ " + esc(sg.b.title) + " <em>(#" + esc(sg.sharedTags[0]) + ")</em></span>" +
            '<button class="ai-btn-text" data-action="apply-suggestion" data-a="' + sg.a.id + '" data-b="' + sg.b.id + '">Enlazar</button></div>';
        }).join("") +
        "</div>";
    }
    return html;
  }
  function callLocalAI(userPrompt, systemPrompt) {
    var base = state.ai.localUrl.replace(/\/$/, "");
    return fetch(base + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: state.ai.localModel || "local-model",
        messages: (systemPrompt ? [{ role: "system", content: systemPrompt }] : []).concat([{ role: "user", content: userPrompt }])
      })
    }).then(function (resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.json();
    }).then(function (data) {
      return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
    });
  }

  function runQuickAction(kind) {
    var note = getActiveNote();
    if (!note) return;
    state.aiLoading = true; state.aiError = ""; state.aiResult = ""; state.aiResultKind = kind;
    renderAssistantOnly();
    var system = "Eres un asistente que ayuda a organizar una base de conocimiento personal en español. Respondes breve y directo.";
    var prompt = "";
    if (kind === "summary") prompt = 'Resume en 3-4 líneas la nota titulada "' + note.title + '":\n\n' + note.content;
    else if (kind === "tags") prompt = 'Sugiere entre 3 y 6 etiquetas cortas (una palabra, sin #) para "' + note.title + '":\n\n' + note.content + "\n\nResponde solo con las palabras separadas por comas.";
    else if (kind === "continue") prompt = 'Continúa la nota "' + note.title + '" con 2-3 frases del mismo tono. Responde solo el texto nuevo:\n\n' + note.content;
    else if (kind === "related") {
      var titles = state.notes.filter(function (n) { return n.id !== note.id; }).map(function (n) { return n.title; });
      if (!titles.length) { state.aiResult = "Todavía no hay otras notas con las que comparar."; state.aiLoading = false; renderAssistantOnly(); return; }
      prompt = 'Nota activa "' + note.title + '":\n\n' + note.content + "\n\nNotas existentes: " + titles.join(", ") + "\n\n¿Cuáles 2-4 están más relacionadas? Responde solo los títulos exactos separados por comas.";
    }
    callLocalAI(prompt, system).then(function (result) {
      state.aiResult = result.trim();
    }).catch(function () {
      state.aiError = "No se pudo conectar con la IA local. Revisá la URL en Configuración y que el servidor tenga CORS habilitado.";
    }).finally(function () {
      state.aiLoading = false;
      renderAssistantOnly();
    });
  }

  function insertAiResult() {
    var note = getActiveNote();
    if (!note || !state.aiResult) return;
    var addition = "";
    if (state.aiResultKind === "summary") addition = "\n\n> Resumen: " + state.aiResult;
    else if (state.aiResultKind === "tags") addition = "\n\n" + state.aiResult.split(",").map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return "#" + t.replace(/^#/, "").replace(/\s+/g, "-"); }).join(" ");
    else if (state.aiResultKind === "continue") addition = "\n\n" + state.aiResult;
    else if (state.aiResultKind === "related") addition = "\n\n" + state.aiResult.split(",").map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return "[[" + t + "]]"; }).join(" ");
    note.content += addition;
    note.updatedAt = Date.now();
    state.aiResult = ""; state.aiResultKind = null;
    saveNotes();
    render();
  }

  function sendChatMessage() {
    var input = document.getElementById("chat-input");
    var text = (input ? input.value : state.chatInput || "").trim();
    if (!text || state.aiLoading) return;
    state.chatMessages.push({ role: "user", content: text });
    state.chatInput = "";
    state.aiLoading = true; state.aiError = "";
    renderAssistantOnly();
    var note = getActiveNote();
    var context;
    if (state.chatUseAllNotes) {
      var all = state.notes.map(function (n) { return "## " + n.title + "\n" + n.content; }).join("\n\n");
      if (all.length > 14000) all = all.slice(0, 14000) + "\n\n[...contexto recortado por tamaño...]";
      context = "Todas las notas del usuario (" + state.notes.length + " en total):\n\n" + all;
    } else {
      context = note ? "Título: " + note.title + "\n\n" + note.content : "El usuario no tiene ninguna nota abierta ahora mismo.";
    }
    var system = "Eres el asistente del segundo cerebro del usuario. Respondes en español, breve y concreto, usando el contexto entregado cuando sea relevante.\n\nContexto:\n" + context;
    var conversation = state.chatMessages.map(function (m) { return (m.role === "user" ? "Usuario" : "Asistente") + ": " + m.content; }).join("\n");
    callLocalAI(conversation, system).then(function (answer) {
      state.chatMessages.push({ role: "assistant", content: answer.trim() });
    }).catch(function () {
      state.chatMessages.push({ role: "assistant", content: "⚠️ No se pudo conectar con la IA local. Revisá la Configuración." });
    }).finally(function () {
      state.aiLoading = false;
      renderAssistantOnly();
    });
  }

  /* ---------- backup ---------- */
  function exportBackup() {
    var data = JSON.stringify({ notes: state.notes, exportedAt: Date.now() }, null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "segundo-cerebro-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        var notes = parsed.notes || parsed;
        if (Array.isArray(notes)) {
          state.notes = notes;
          sanitizeNotes();
          state.activeId = notes.length ? notes[0].id : null;
          updateHash(state.activeId);
          saveNotes();
          render();
        }
      } catch (e) { alert("El archivo no es una copia de seguridad válida."); }
    };
    reader.readAsText(file);
  }

  /* ---------- render helpers ---------- */
  function svgGraphLayout(notes, w, h) {
    var idByTitle = {};
    notes.forEach(function (n) { idByTitle[n.title.toLowerCase()] = n.id; });
    var nodes = notes.map(function (n) { return { id: n.id, title: n.title, x: w / 2 + (Math.random() - 0.5) * 120, y: h / 2 + (Math.random() - 0.5) * 120, vx: 0, vy: 0 }; });
    var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
    var seen = {}, links = [];
    notes.forEach(function (n) {
      extractWikilinks(n.content).forEach(function (t) {
        var tid = idByTitle[t.toLowerCase()];
        if (tid && tid !== n.id) {
          var k = [n.id, tid].sort().join("|");
          if (!seen[k]) { seen[k] = true; links.push({ source: n.id, target: tid }); }
        }
      });
    });
    var degree = {};
    links.forEach(function (l) { degree[l.source] = (degree[l.source] || 0) + 1; degree[l.target] = (degree[l.target] || 0) + 1; });
    nodes.forEach(function (n) { n.degree = degree[n.id] || 0; });

    for (var iter = 0; iter < 220; iter++) {
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i + 1; j < nodes.length; j++) {
          var a = nodes[i], b = nodes[j];
          var dx = a.x - b.x, dy = a.y - b.y;
          var distSq = dx * dx + dy * dy || 0.01;
          var dist = Math.sqrt(distSq);
          var force = 850 / distSq;
          var fx = (dx / dist) * force, fy = (dy / dist) * force;
          a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
        }
      }
      links.forEach(function (l) {
        var a = byId[l.source], b = byId[l.target];
        var dx = b.x - a.x, dy = b.y - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var force = (dist - 85) * 0.05;
        var fx = (dx / dist) * force, fy = (dy / dist) * force;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      });
      nodes.forEach(function (n) {
        n.vx += (w / 2 - n.x) * 0.01;
        n.vy += (h / 2 - n.y) * 0.01;
        n.vx *= 0.82; n.vy *= 0.82;
        n.x += n.vx; n.y += n.vy;
      });
    }
    return { nodes: nodes, links: links };
  }

  function graphSvgHTML(w, h) {
    if (state.notes.length === 0) return '<div class="graph-empty-full">Enlazá notas con [[dobles corchetes]] para ver tu mapa de ideas.</div>';
    var layout = svgGraphLayout(state.notes, w, h);
    var byId = {}; layout.nodes.forEach(function (n) { byId[n.id] = n; });
    var svg = '<svg viewBox="0 0 ' + w + " " + h + '" class="full-graph-svg" preserveAspectRatio="xMidYMid meet">';
    layout.links.forEach(function (l) {
      var a = byId[l.source], b = byId[l.target];
      svg += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" class="graph-edge"></line>';
    });
    layout.nodes.forEach(function (n) {
      var r = 5 + Math.min(n.degree, 8) * 1.5;
      var isActive = n.id === state.activeId;
      if (isActive) svg += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + (r + 6) + '" class="graph-node-halo"></circle>';
      svg += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + r + '" class="' + (isActive ? "graph-node-active" : "graph-node-full") + '" data-action="navigate" data-title="' + esc(n.title) + '"></circle>';
      var label = n.title.length > 16 ? n.title.slice(0, 15) + "…" : n.title;
      svg += '<text x="' + n.x + '" y="' + (n.y + r + 12) + '" text-anchor="middle" class="graph-label-full">' + esc(label) + "</text>";
    });
    svg += "</svg>";
    return svg;
  }

  function sidebarTreeHTML(nodes, depth) {
