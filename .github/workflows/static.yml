  ];
  function slashMenuHTML() {
    return '<div class="insert-menu-backdrop" data-action="close-slash-menu"></div>' +
      '<div class="insert-menu" style="top:auto;bottom:calc(100% + 6px);right:auto;left:0;">' +
      '<div class="insert-menu-hint">BLOQUE</div>' +
