    var section = state.assistantSection;
    var header = '<div class="assistant-header">' +
      '<div class="segmented-control">' +
        '<button class="' + (section === "details" ? "active" : "") + '" data-action="assistant-section" data-section="details">Detalles</button>' +
        '<button class="' + (section === "graph" ? "active" : "") + '" data-action="assistant-section" data-section="graph">Grafo</button>' +
        '<button class="' + (section === "chat" ? "active" : "") + '" data-action="assistant-section" data-section="chat">Asistente</button>' +
      "</div>" +
      '<div style="display:flex;gap:2px;">' +
        (section === "chat" ? '<button class="icon-btn" data-action="toggle-ai-settings" title="Configurar IA">⚙️</button>' : "") +
        (closable ? '<button class="icon-btn" data-action="close-assistant" title="Cerrar">✕</button>' : "") +
      "</div>" +
    "</div>";

    var body = "";
    if (section === "details") {
      if (!note) {
        body = '<div class="assistant-body"><div class="assist-muted center-pad">Seleccioná una nota para ver sus detalles.</div></div>';
      } else {
        var tags = extractTags(note.content);
        var backlinks = getBacklinks(note);
        body = '<div class="assistant-body">' +
          '<div class="assist-card"><div class="assist-label">Etiquetas</div>' +
          (tags.length === 0 ? '<div class="assist-muted">Sin etiquetas. Escribí #palabra en el texto.</div>' : tags.map(function (t) { return '<span class="context-tag">#' + esc(t) + "</span>"; }).join("")) +
          "</div>" +
          '<div class="assist-card"><div class="assist-label">🔗 Menciones</div>' +
          (backlinks.length === 0 ? '<div class="assist-muted">Ninguna nota enlaza aquí todavía.</div>' : backlinks.map(function (n) { return '<div class="backlink-item" data-action="select-note" data-id="' + n.id + '">' + esc(n.title) + "</div>"; }).join("")) +
          "</div></div>";
      }
    } else if (section === "graph") {
      var w = state.isMobile ? 340 : 760, h = state.isMobile ? 300 : 420;
      body = '<div class="assistant-body">' +
        '<div class="graph-embed" id="graph-embed" style="min-height:' + h + 'px;">' + graphSvgHTML(w, h) + "</div>" +
        analysisHTML() +
        "</div>";
    } else if (section === "chat") {
      body = '<div class="assistant-body">';
      if (state.showAiSettings) {
        body += '<div class="ai-settings-card">' +
          '<div class="ai-settings-label">IA LOCAL (OPCIONAL)</div>' +
          '<input id="ai-url-input" class="ai-text-field" placeholder="http://localhost:11434/v1" value="' + esc(state.ai.localUrl) + '" />' +
          '<input id="ai-model-input" class="ai-text-field" placeholder="Nombre del modelo, ej. llama3" value="' + esc(state.ai.localModel) + '" />' +
          '<div class="ai-hint">Se conecta a un servidor compatible con la API de OpenAI (Ollama, LM Studio, etc.) que vos controlás. Sin esto configurado, el asistente no funciona — el resto de la app sigue funcionando igual.</div>' +
        "</div>";
      }
      body += '<div class="ai-hint" style="margin-bottom:2px;"><span class="vault-toggle" data-action="toggle-vault-context">' + (state.chatUseAllNotes ? "☑" : "☐") + " Usar todo el vault como contexto (como NotebookLM)</span></div>";
      body += '<div class="ai-quick-actions">' +
        ["summary:Resumir", "tags:Etiquetas", "continue:Continuar", "related:Relacionadas"].map(function (pair) {
          var parts = pair.split(":"); var key = parts[0], label = parts[1];
          var loading = state.aiLoading && state.aiResultKind === key;
          return '<button class="ai-chip-btn" ' + (!note || state.aiLoading ? "disabled" : "") + ' data-action="quick-action" data-kind="' + key + '">' + (loading ? '<span class="spin">⟳</span>' : "✨") + " " + label + "</button>";
        }).join("") + "</div>";
      if (!note) body += '<div class="ai-hint">Abrí o creá una nota para usar las acciones rápidas.</div>';
      if (state.aiError) body += '<div class="ai-error-text">' + esc(state.aiError) + "</div>";
      if (state.aiResult) {
        body += '<div class="ai-result-card">' + esc(state.aiResult) +
          '<div class="ai-result-actions"><button class="ai-btn-filled" data-action="insert-ai-result">Insertar en la nota</button>' +
          '<button class="ai-btn-text" data-action="discard-ai-result">Descartar</button></div></div>';
      }
      body += '<div class="ai-chat-thread">';
      if (state.chatMessages.length === 0) body += '<div class="ai-chat-empty">Preguntale algo a tu segundo cerebro.</div>';
      else state.chatMessages.forEach(function (m) { body += '<div class="chat-bubble ' + m.role + '">' + esc(m.content) + "</div>"; });
      body += "</div></div>" +
        '<div class="ai-chat-input-row">' +
          '<input id="chat-input" placeholder="Escribe una pregunta…" value="' + esc(state.chatInput) + '" />' +
          '<button class="ai-send-btn" data-action="send-chat" ' + (state.aiLoading ? "disabled" : "") + ">" + (state.aiLoading ? '<span class="spin">⟳</span>' : "➤") + "</button>" +
        "</div>";
    }
    return '<div class="assistant-wrap">' + header + body + "</div>";
  }

  /* ---------- top-level render ---------- */
  function render() {
    var root = document.getElementById("app");
    var html;
    if (state.isMobile) {
      var content = state.mobileTab === "list" ? sidebarHTML()
        : state.mobileTab === "editor" ? editorHTML()
        : assistantHTML(false);
      html = '<div class="app-shell mobile-shell">' +
        '<div class="mobile-content">' + content + "</div>" +
        '<div class="bottom-nav">' +
          '<button class="' + (state.mobileTab === "list" ? "active" : "") + '" data-action="mobile-tab" data-tab="list"><span class="nav-indicator">📒</span>Notas</button>' +
          '<button class="' + (state.mobileTab === "editor" ? "active" : "") + '" data-action="mobile-tab" data-tab="editor"><span class="nav-indicator">✏️</span>Editor</button>' +
          '<button class="' + (state.mobileTab === "assistant" ? "active" : "") + '" data-action="mobile-tab" data-tab="assistant"><span class="nav-indicator">✨</span>Asistente</button>' +
        "</div>" +
      "</div>";
    } else {
      html = '<div class="app-shell">' + sidebarHTML() + (state.assistantOpen ? assistantHTML(true) : editorHTML()) + "</div>";
    }
    root.innerHTML = html;
    focusPreserved();
  }

  function renderAssistantOnly() {
    var el = document.querySelector(".assistant-wrap");
    if (!el) { render(); return; }
    el.outerHTML = assistantHTML(!state.isMobile);
  }

  function focusPreserved() {
    // no-op placeholder: full render already happened; inputs re-focus is handled per-action where needed
  }

  /* ---------- event delegation ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    switch (action) {
      case "new-note": createNote(); break;
      case "select-note": selectNote(el.getAttribute("data-id")); break;
      case "ask-delete": state.confirmDeleteId = el.getAttribute("data-id"); render(); break;
      case "confirm-delete": deleteNote(el.getAttribute("data-id")); break;
      case "cancel-delete": state.confirmDeleteId = null; render(); break;
      case "filter-tag": state.tagFilter = el.getAttribute("data-tag"); render(); break;
      case "filter-tag-all": state.tagFilter = null; render(); break;
      case "navigate": navigateToNote(el.getAttribute("data-title")); break;
      case "open-assistant": state.assistantOpen = true; if (state.isMobile) state.mobileTab = "assistant"; render(); break;
      case "close-assistant": state.assistantOpen = false; render(); break;
      case "mobile-tab": state.mobileTab = el.getAttribute("data-tab"); render(); break;
      case "assistant-section": state.assistantSection = el.getAttribute("data-section"); render(); break;
      case "toggle-view-mode": state.viewMode = state.viewMode === "edit" ? "preview" : "edit"; render(); break;
      case "toggle-insert-menu": state.showInsertMenu = !state.showInsertMenu; render(); break;
      case "close-insert-menu": state.showInsertMenu = false; render(); break;
      case "insert-link": insertTemplate("[[", "nombre de la nota", "]]", false); break;
      case "insert-embed": insertTemplate("![[", "nombre de la nota", "]]", true); break;
      case "insert-youtube": insertTemplate("", "https://youtu.be/ID-del-video", "", true); break;
      case "insert-image": insertTemplate("", "https://enlace-a-imagen-o-diapositivas", "", true); break;
      case "toggle-ai-settings": state.showAiSettings = !state.showAiSettings; render(); break;
      case "quick-action": runQuickAction(el.getAttribute("data-kind")); break;
      case "insert-ai-result": insertAiResult(); break;
      case "discard-ai-result": state.aiResult = ""; state.aiResultKind = null; render(); break;
      case "send-chat": sendChatMessage(); break;
      case "toggle-backup": state.showBackup = !state.showBackup; render(); break;
      case "export-backup": exportBackup(); break;
      case "import-backup": document.getElementById("import-file-input").click(); break;
      case "toggle-expand": {
        var eid = el.getAttribute("data-id");
        state.expandedIds[eid] = !state.expandedIds[eid];
        render();
        break;
      }
      case "new-subnote": createNote(null, el.getAttribute("data-id")); break;
      case "edit-icon": {
        var nid = el.getAttribute("data-id");
        var n3 = state.notes.find(function (x) { return x.id === nid; });
        if (n3) {
          var val = prompt("Icono (emoji o texto corto):", n3.icon || "📄");
          if (val !== null) { n3.icon = val.trim() || "📄"; n3.updatedAt = Date.now(); saveNotes(); render(); }
        }
        break;
      }
      case "copy-link": copyToClipboard(noteLinkFor(el.getAttribute("data-id"))); toast("Enlace copiado"); break;
      case "copy-markdown": {
        var n4 = state.notes.find(function (x) { return x.id === el.getAttribute("data-id"); });
        if (n4) { copyToClipboard(noteAsMarkdown(n4)); toast("Markdown copiado — pegalo en tu IA local o NotebookLM"); }
        break;
      }
      case "export-vault-md": exportVaultMarkdown(); break;
      case "toggle-vault-context": state.chatUseAllNotes = !state.chatUseAllNotes; renderAssistantOnly(); break;
      case "toggle-todo": toggleTodo(el.getAttribute("data-owner"), parseInt(el.getAttribute("data-line"), 10)); break;
      case "apply-suggestion": {
        var aid = el.getAttribute("data-a"), bid = el.getAttribute("data-b");
        var na = state.notes.find(function (x) { return x.id === aid; });
        var nb = state.notes.find(function (x) { return x.id === bid; });
        if (na && nb) {
          na.content += "\n\n[[" + nb.title + "]]";
          na.updatedAt = Date.now();
          saveNotes();
          toast("Enlazado: " + na.title + " → " + nb.title);
          renderAssistantOnly();
        }
        break;
      }
      case "close-slash-menu": state.slashMenu.open = false; render(); break;
      case "slash-pick": applySlashBlock(el.getAttribute("data-key")); break;
    }
  });

  document.getElementById("import-file-input").addEventListener("change", function (e) {
    if (e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = "";
  });

  /* text inputs: update state silently, no full re-render while typing */
  document.addEventListener("input", function (e) {
    var id = e.target.id;
    if (id === "search-input") {
      state.query = e.target.value;
      var container = document.getElementById("note-list-container");
      if (container) container.innerHTML = sidebarListInnerOnly();
      return;
    }
    if (id === "title-input") {
      var note = getActiveNote();
      if (note) { note.title = e.target.value; note.updatedAt = Date.now(); saveNotes(); }
      return;
    }
    if (id === "content-textarea") {
      var n2 = getActiveNote();
      if (n2) {
        n2.content = e.target.value;
        n2.updatedAt = Date.now();
        saveNotes();
        var sb = document.getElementById("status-bar");
        if (sb) {
          var wc = n2.content.trim() ? n2.content.trim().split(/\s+/).length : 0;
          sb.textContent = wc + " palabras · guardado · editado justo ahora";
        }
      }
      var ta = e.target;
      var pos = ta.selectionStart;
      var val = ta.value;
      var slashContainer = document.getElementById("slash-menu-container");
      if (pos > 0 && val[pos - 1] === "/" && (pos === 1 || val[pos - 2] === "\n")) {
        state.slashMenu = { open: true, triggerPos: pos - 1 };
        if (slashContainer) slashContainer.innerHTML = slashMenuHTML();
      } else if (state.slashMenu.open) {
        state.slashMenu.open = false;
        if (slashContainer) slashContainer.innerHTML = "";
      }
      return;
    }
    if (id === "chat-input") { state.chatInput = e.target.value; return; }
    if (id === "ai-url-input") { state.ai.localUrl = e.target.value; saveAi(); return; }
    if (id === "ai-model-input") { state.ai.localModel = e.target.value; saveAi(); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "chat-input" && e.key === "Enter") sendChatMessage();
  });

  function sidebarListInnerOnly() {
    var notes = getFilteredNotes();
    if (notes.length === 0) return '<div class="empty-state">' + (state.notes.length === 0 ? "No hay notas todavía. Creá la primera con el botón de abajo." : "Sin resultados para tu búsqueda.") + "</div>";
    var html = "";
    notes.forEach(function (n) {
      var confirming = state.confirmDeleteId === n.id;
      html += '<div class="note-list-item ' + (n.id === state.activeId ? "active" : "") + '" data-action="select-note" data-id="' + n.id + '">' +
        '<div class="note-row-top"><span class="tree-toggle-spacer"></span><span class="note-icon">' + esc(n.icon || "📄") + '</span><div class="note-list-title">' + esc(n.title || "Nota sin título") + "</div></div>" +
        '<div class="note-list-meta" style="padding-left:20px;">' + relTime(n.updatedAt) + "</div>";
      if (confirming) {
        html += '<div class="confirm-row" style="position:absolute;right:8px;top:8px;">' +
          '<button class="confirm-btn yes" data-action="confirm-delete" data-id="' + n.id + '">✓</button>' +
          '<button class="confirm-btn no" data-action="cancel-delete">✕</button></div>';
      } else {
        html += '<button class="note-delete-btn" data-action="ask-delete" data-id="' + n.id + '">🗑</button>';
      }
      html += "</div>";
    });
    return html;
  }

  init();
})();
</script>
</body>
</html>
