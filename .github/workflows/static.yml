        '<div class="note-row-top" style="padding-left:' + depth * 16 + 'px;">' +
          (hasKids ? '<span class="tree-toggle" data-action="toggle-expand" data-id="' + n.id + '">' + (expanded ? "▾" : "▸") + "</span>" : '<span class="tree-toggle-spacer"></span>') +
          '<span class="note-icon">' + esc(n.icon || "📄") + "</span>" +
