<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Segundo Cerebro</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: contain; height: 100%; }

  :root {
    --md-surface: #0E0F13;
    --md-surface-container-lowest: #08090B;
    --md-surface-container-low: #16181D;
    --md-surface-container: #1B1E24;
    --md-surface-container-high: #22262E;
    --md-surface-container-highest: #2B303A;
    --md-on-surface: #E3E2E9;
    --md-on-surface-variant: #C4C6D0;
    --md-outline-variant: #383B42;
    --md-primary: #AEC6FF;
    --md-on-primary-container: #D7E2FF;
    --md-primary-container: #1E3A6D;
    --md-secondary: #BEC6DC;
    --md-secondary-container: #3A4258;
    --md-on-secondary-container: #DAE2FF;
    --md-error: #FFB4AB;
    --shape-xs: 4px; --shape-sm: 8px; --shape-md: 12px; --shape-lg: 16px; --shape-full: 999px;
    --elev-1: 0 1px 2px rgba(0,0,0,.45), 0 1px 3px 1px rgba(0,0,0,.25);
    --elev-2: 0 1px 2px rgba(0,0,0,.45), 0 3px 8px 2px rgba(0,0,0,.25);
    --elev-3: 0 2px 4px rgba(0,0,0,.45), 0 5px 12px 3px rgba(0,0,0,.3);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  #app, .app-shell { display: flex; height: 100vh; height: 100dvh; width: 100%; background: var(--md-surface); color: var(--md-on-surface); font-family: var(--font-ui); overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 264px; min-width: 264px; background: var(--md-surface-container-low); display: flex; flex-direction: column; height: 100%; }
  .sidebar-header { padding: 20px 16px 14px 16px; }
  .app-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .app-title { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--md-primary); }
  .icon-btn { background: transparent; border: none; color: var(--md-on-surface-variant); width: 36px; height: 36px; border-radius: var(--shape-full); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 17px; }
  .icon-btn:hover { background: rgba(174,198,255,.10); color: var(--md-primary); }
  .search-box { display: flex; align-items: center; gap: 10px; background: var(--md-surface-container-high); border-radius: var(--shape-full); padding: 10px 16px; }
  .search-box input { background: transparent; border: none; outline: none; color: var(--md-on-surface); font-family: var(--font-ui); font-size: 14px; width: 100%; }
  .search-box input::placeholder { color: var(--md-on-surface-variant); }
  .fab-extended { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--md-primary-container); color: var(--md-on-primary-container); border: none; border-radius: var(--shape-lg); padding: 13px 20px; font-family: var(--font-ui); font-weight: 500; font-size: 14px; cursor: pointer; box-shadow: var(--elev-1); }
  .fab-extended:hover { background: #244482; }
  .fab-round { position: absolute; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: var(--shape-lg); background: var(--md-primary-container); color: var(--md-on-primary-container); border: none; display: flex; align-items: center; justify-content: center; box-shadow: var(--elev-3); cursor: pointer; z-index: 5; font-size: 22px; }
  .note-list { flex: 1; overflow-y: auto; padding: 4px 12px 12px 12px; -webkit-overflow-scrolling: touch; }
  .note-list-item { padding: 13px 16px; margin-bottom: 3px; cursor: pointer; border-radius: var(--shape-md); position: relative; }
  .note-list-item:hover { background: rgba(255,255,255,.045); }
  .note-list-item.active { background: var(--md-secondary-container); }
  .note-list-title { font-size: 14px; font-weight: 500; color: var(--md-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 26px; }
  .note-list-item.active .note-list-title { color: var(--md-on-secondary-container); }
  .note-list-meta { font-size: 11.5px; color: var(--md-on-surface-variant); margin-top: 3px; }
  .note-delete-btn { position: absolute; right: 8px; top: 10px; opacity: .55; background: none; border: none; color: var(--md-error); cursor: pointer; padding: 6px; border-radius: var(--shape-full); font-size: 14px; }
  .empty-state { padding: 24px 12px; font-size: 13px; color: var(--md-on-surface-variant); line-height: 1.6; }
  .tag-filter-bar { border-top: 1px solid var(--md-outline-variant); padding: 14px 20px 16px 20px; max-height: 100px; overflow-y: auto; }
  .tag-pill-side { display: inline-flex; align-items: center; font-size: 12.5px; color: var(--md-on-surface-variant); background: var(--md-surface-container-high); border-radius: var(--shape-full); padding: 5px 12px; margin: 0 6px 6px 0; cursor: pointer; }
  .tag-pill-side.active { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }

  /* Main editor */
  .main-panel { flex: 1; display: flex; flex-direction: column; background: var(--md-surface); min-width: 0; height: 100%; }
  .editor-topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px 0 28px; gap: 14px; }
  .title-input { font-family: var(--font-ui); font-size: 26px; font-weight: 500; color: var(--md-on-surface); background: transparent; border: none; outline: none; width: 100%; min-width: 0; }
  .title-input::placeholder { color: var(--md-on-surface-variant); }
  .topbar-actions { display: flex; gap: 4px; flex-shrink: 0; position: relative; flex-wrap: wrap; justify-content: flex-end; }
  .editor-divider { border: none; border-top: 1px solid var(--md-outline-variant); margin: 18px 28px 0 28px; }
  .editor-body { flex: 1; overflow-y: auto; padding: 20px 28px 0 28px; -webkit-overflow-scrolling: touch; }
  #content-textarea { width: 100%; height: 100%; resize: none; border: none; outline: none; background: transparent; font-family: var(--font-ui); font-size: 16px; line-height: 1.8; color: var(--md-on-surface); }
  #content-textarea::placeholder { color: var(--md-on-surface-variant); }
  .preview-pane { font-family: var(--font-ui); font-size: 16px; line-height: 1.8; color: var(--md-on-surface); }

  .md-h1 { font-size: 28px; font-weight: 600; margin: 4px 0 12px 0; }
  .md-h2 { font-size: 22px; font-weight: 600; margin: 20px 0 8px 0; }
  .md-h3 { font-size: 18.5px; font-weight: 600; margin: 16px 0 6px 0; }
  .md-h4 { font-size: 16px; font-weight: 600; margin: 12px 0 6px 0; }
  .md-p { margin: 0 0 14px 0; }
  .md-quote { border-left: 3px solid var(--md-primary); padding: 4px 0 4px 16px; margin: 12px 0; color: var(--md-on-surface-variant); background: var(--md-surface-container-low); border-radius: 0 var(--shape-sm) var(--shape-sm) 0; }
  .md-ul, .md-ol { margin: 0 0 14px 22px; padding: 0; }
  .md-ul li, .md-ol li { margin-bottom: 5px; }
  .md-hr { border: none; border-top: 1px solid var(--md-outline-variant); margin: 20px 0; }
  .md-inline-code { font-family: var(--font-mono); background: var(--md-surface-container-high); padding: 2px 6px; border-radius: var(--shape-xs); font-size: 14px; color: var(--md-primary); }
  .md-code-block { font-family: var(--font-mono); background: var(--md-surface-container-lowest); color: var(--md-on-surface); padding: 14px 16px; border-radius: var(--shape-md); font-size: 13.5px; overflow-x: auto; margin: 12px 0; border: 1px solid var(--md-outline-variant); white-space: pre-wrap; }
  .md-link { color: var(--md-primary); text-decoration: underline; }
  .md-wikilink { color: var(--md-primary); background: rgba(174,198,255,.12); border-radius: var(--shape-xs); padding: 1px 4px; cursor: pointer; }
  .md-wikilink:hover { background: rgba(174,198,255,.22); }
  .md-wikilink-new { color: var(--md-on-surface-variant); border-bottom: 1px dashed var(--md-on-surface-variant); cursor: pointer; }
  .md-tag { color: var(--md-secondary); }
  .md-inline-img { max-width: 100%; border-radius: var(--shape-sm); vertical-align: middle; margin: 4px 0; }
  .md-block-img { max-width: 100%; border-radius: var(--shape-md); display: block; margin: 12px 0; }
  .md-embed-media { position: relative; width: 100%; padding-top: 56.25%; margin: 14px 0; border-radius: var(--shape-md); overflow: hidden; background: var(--md-surface-container-lowest); }
  .md-embed-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  .md-link-card { display: flex; flex-direction: column; gap: 2px; background: var(--md-surface-container); border: 1px solid var(--md-outline-variant); border-radius: var(--shape-md); padding: 12px 14px; margin: 12px 0; text-decoration: none; max-width: 420px; }
  .md-link-card:hover { background: var(--md-surface-container-high); }
  .md-link-card-host { font-size: 13px; font-weight: 600; color: var(--md-on-surface); }
  .md-link-card-url { font-size: 11.5px; color: var(--md-primary); word-break: break-all; }
  .md-embed { border-left: 3px solid var(--md-secondary); background: var(--md-surface-container-low); border-radius: 0 var(--shape-md) var(--shape-md) 0; margin: 14px 0; overflow: hidden; }
  .md-embed-title { font-size: 12.5px; font-weight: 600; color: var(--md-secondary); padding: 10px 14px; cursor: pointer; background: var(--md-surface-container); }
  .md-embed-body { padding: 12px 14px; font-size: 15px; }

  .status-bar { border-top: 1px solid var(--md-outline-variant); padding: 10px 28px; font-size: 11.5px; color: var(--md-on-surface-variant); }
  .no-note-selected { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--md-on-surface-variant); font-size: 14px; flex-direction: column; gap: 12px; text-align: center; padding: 20px; }
  .confirm-row { display: flex; gap: 4px; align-items: center; }
  .confirm-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: var(--shape-full); font-size: 14px; }
  .confirm-btn.yes { color: var(--md-error); }
  .confirm-btn.no { color: var(--md-on-surface-variant); }

  .insert-menu-backdrop { position: fixed; inset: 0; z-index: 30; background: transparent; }
  .insert-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--md-surface-container-high); border-radius: var(--shape-md); box-shadow: var(--elev-3); padding: 6px; z-index: 31; min-width: 210px; }
  .insert-menu button { display: block; width: 100%; text-align: left; background: transparent; border: none; color: var(--md-on-surface); font-family: var(--font-ui); font-size: 13px; padding: 10px 12px; border-radius: var(--shape-sm); cursor: pointer; }
  .insert-menu button:hover { background: var(--md-surface-container-highest); }
  .insert-menu-hint { font-size: 11px; color: var(--md-on-surface-variant); padding: 6px 12px 2px 12px; }

  /* Tree / nested pages */
  .note-row-top { display: flex; align-items: center; gap: 2px; padding-right: 60px; }
  .tree-toggle { width: 14px; flex-shrink: 0; cursor: pointer; font-size: 10px; color: var(--md-on-surface-variant); text-align: center; }
  .tree-toggle-spacer { width: 14px; flex-shrink: 0; display: inline-block; }
  .note-icon { flex-shrink: 0; font-size: 13px; }
  .note-add-sub { position: absolute; right: 34px; top: 10px; opacity: .55; background: none; border: none; color: var(--md-on-surface-variant); cursor: pointer; font-size: 14px; padding: 6px; border-radius: var(--shape-full); }
  .note-icon-btn { font-size: 20px; margin-right: 4px; }
  .breadcrumb { padding: 14px 28px 0 28px; font-size: 12px; color: var(--md-on-surface-variant); display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .breadcrumb-item { cursor: pointer; }
  .breadcrumb-item.current { color: var(--md-on-surface); cursor: default; }
  .breadcrumb-item:hover:not(.current) { color: var(--md-primary); }
  .breadcrumb-sep { color: var(--md-outline-variant); }
  .note-link-row { padding: 4px 28px 0 28px; font-size: 11px; color: var(--md-on-surface-variant); word-break: break-all; }

  /* Todo checkboxes */
  .md-todo-list { list-style: none; margin: 0 0 14px 0; padding: 0; }
  .md-todo-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .md-todo-check { cursor: pointer; flex-shrink: 0; }
  .md-todo-done { color: var(--md-on-surface-variant); text-decoration: line-through; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--md-surface-container-highest); color: var(--md-on-surface); padding: 10px 18px; border-radius: var(--shape-full); font-family: var(--font-ui); font-size: 13px; box-shadow: var(--elev-3); z-index: 100; opacity: 0; transition: opacity .25s ease; max-width: 90vw; text-align: center; }
  .vault-toggle { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .stat-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-box { flex: 1; min-width: 64px; background: var(--md-surface-container-high); border-radius: var(--shape-sm); padding: 10px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: 600; color: var(--md-primary); }
  .stat-label { font-size: 10.5px; color: var(--md-on-surface-variant); margin-top: 2px; }
  .suggestion-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--md-outline-variant); font-size: 12.5px; }
  .suggestion-row:last-child { border-bottom: none; }

  /* Assistant */
  .assistant-wrap { width: 100%; height: 100%; background: var(--md-surface); display: flex; flex-direction: column; }
  .assistant-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; gap: 10px; }
  .segmented-control { display: flex; border-radius: var(--shape-full); background: var(--md-surface-container-high); padding: 3px; flex: 1; max-width: 340px; }
  .segmented-control button { flex: 1; background: transparent; border: none; padding: 8px 8px; cursor: pointer; color: var(--md-on-surface-variant); font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; border-radius: var(--shape-full); }
  .segmented-control button.active { background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .assistant-body { flex: 1; overflow-y: auto; padding: 0 20px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .assist-card { background: var(--md-surface-container); border-radius: var(--shape-md); padding: 14px 16px; }
  .assist-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--md-on-surface-variant); margin-bottom: 10px; text-transform: uppercase; }
  .assist-muted { font-size: 12.5px; color: var(--md-on-surface-variant); }
  .center-pad { display: flex; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 30px; }
  .context-tag { display: inline-flex; font-size: 12.5px; color: var(--md-secondary); background: var(--md-secondary-container); border-radius: var(--shape-full); padding: 4px 10px; margin: 0 6px 6px 0; }
  .backlink-item { font-size: 13px; color: var(--md-on-surface); padding: 9px 10px; border-radius: var(--shape-sm); cursor: pointer; margin-bottom: 2px; }
  .backlink-item:hover { background: var(--md-surface-container-high); }
  .graph-embed { flex: 1; min-height: 320px; background: var(--md-surface-container-lowest); border-radius: var(--shape-md); overflow: hidden; }
  .full-graph-svg { width: 100%; height: 100%; }
  .graph-edge { stroke: var(--md-outline-variant); stroke-width: 1.2; }
  .graph-node-full { fill: var(--md-primary); opacity: .85; cursor: pointer; }
  .graph-node-active { fill: var(--md-primary); cursor: pointer; }
  .graph-node-halo { fill: rgba(174,198,255,.18); }
  .graph-label-full { font-size: 10px; fill: var(--md-on-surface-variant); font-family: var(--font-ui); pointer-events: none; }
  .graph-empty-full { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--md-on-surface-variant); font-size: 13.5px; text-align: center; padding: 30px; }

  .ai-settings-card { background: var(--md-surface-container); border-radius: var(--shape-md); padding: 16px; }
  .ai-settings-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--md-on-surface-variant); margin-bottom: 10px; }
  .ai-text-field { width: 100%; background: var(--md-surface-container-high); border: 1px solid var(--md-outline-variant); border-radius: var(--shape-sm); color: var(--md-on-surface); font-family: var(--font-mono); font-size: 12.5px; padding: 10px 12px; outline: none; margin-bottom: 8px; }
  .ai-hint { font-size: 11.5px; color: var(--md-on-surface-variant); line-height: 1.5; }
  .ai-quick-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .ai-chip-btn { display: flex; align-items: center; gap: 6px; background: var(--md-surface-container-high); color: var(--md-on-surface); border: none; border-radius: var(--shape-full); padding: 10px 16px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .ai-chip-btn:hover { background: var(--md-surface-container-highest); }
  .ai-chip-btn:disabled { opacity: .5; cursor: default; }
  .ai-result-card { background: var(--md-surface-container); border-left: 3px solid var(--md-primary); border-radius: var(--shape-sm); padding: 14px 16px; font-size: 13.5px; line-height: 1.6; }
  .ai-result-actions { display: flex; gap: 8px; margin-top: 12px; }
  .ai-btn-filled { background: var(--md-primary-container); color: var(--md-on-primary-container); border: none; border-radius: var(--shape-full); padding: 8px 16px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .ai-btn-text { background: transparent; color: var(--md-on-surface-variant); border: none; border-radius: var(--shape-full); padding: 8px 16px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .ai-error-text { font-size: 12.5px; color: var(--md-error); }
  .ai-chat-thread { display: flex; flex-direction: column; gap: 10px; }
  .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: var(--shape-md); font-size: 13.5px; line-height: 1.55; }
  .chat-bubble.user { align-self: flex-end; margin-left: auto; background: var(--md-primary-container); color: var(--md-on-primary-container); border-bottom-right-radius: var(--shape-xs); }
  .chat-bubble.assistant { align-self: flex-start; background: var(--md-surface-container-high); color: var(--md-on-surface); border-bottom-left-radius: var(--shape-xs); }
  .ai-chat-empty { font-size: 12.5px; color: var(--md-on-surface-variant); text-align: center; padding: 20px 0; }
  .ai-chat-input-row { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--md-outline-variant); }
  .ai-chat-input-row input { flex: 1; background: var(--md-surface-container-high); border: none; border-radius: var(--shape-full); padding: 12px 18px; color: var(--md-on-surface); font-family: var(--font-ui); font-size: 13.5px; outline: none; }
  .ai-send-btn { width: 44px; height: 44px; border-radius: var(--shape-full); background: var(--md-primary-container); color: var(--md-on-primary-container); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .ai-send-btn:disabled { opacity: .5; cursor: default; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }

  /* Backup panel */
  .backup-row { display: flex; gap: 8px; }
  .backup-btn { flex: 1; background: var(--md-surface-container-high); color: var(--md-on-surface); border: none; border-radius: var(--shape-sm); padding: 10px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .backup-btn:hover { background: var(--md-surface-container-highest); }

  /* Mobile */
  .mobile-shell { flex-direction: column; }
  .mobile-content { flex: 1; overflow: hidden; min-height: 0; display: flex; position: relative; }
  .bottom-nav { display: flex; background: var(--md-surface-container-low); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)) 8px; flex-shrink: 0; }
  .bottom-nav button { flex: 1; background: none; border: none; color: var(--md-on-surface-variant); padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; font-family: var(--font-ui); font-size: 11.5px; font-weight: 500; cursor: pointer; }
  .nav-indicator { display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: var(--shape-full); font-size: 18px; }
  .bottom-nav button.active .nav-indicator { background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .bottom-nav button.active { color: var(--md-on-surface); }

  @media (max-width: 759px) {
    .title-input { font-size: 22px; }
    .editor-topbar { padding: 18px 18px 0 18px; }
    .editor-divider { margin: 14px 18px 0 18px; }
    .editor-body { padding: 16px 18px 0 18px; }
    .status-bar { padding: 10px 18px; }
    .sidebar-header { padding: 18px 16px 12px 16px; }
    .tag-filter-bar { padding: 12px 16px 14px 16px; }
    .note-list { padding: 4px 8px 90px 8px; }
    .assistant-header { padding: 14px 16px; }
    .assistant-body { padding: 0 16px 16px 16px; }
    .ai-chat-input-row { padding: 12px 16px; }
    .icon-btn { width: 32px; height: 32px; font-size: 15px; }
    .note-icon-btn { font-size: 18px; }
    .editor-topbar { flex-wrap: wrap; row-gap: 6px; }
    .note-link-row { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="import-file-input" accept="application/json" style="display:none" />
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "segundo-cerebro-notas-v1";
  var AI_KEY = "segundo-cerebro-ai-v1";

  var state = {
    notes: [],
    activeId: null,
    query: "",
    tagFilter: null,
    viewMode: "edit",
    isMobile: window.innerWidth < 760,
    mobileTab: "list",
    assistantOpen: false,
    assistantSection: "details",
    confirmDeleteId: null,
    showInsertMenu: false,
    showBackup: false,
    expandedIds: {},
    slashMenu: { open: false, triggerPos: 0 },
    chatUseAllNotes: false,
    ai: { localUrl: "http://localhost:11434/v1", localModel: "llama3" },
    aiLoading: false,
    aiError: "",
    aiResultKind: null,
    aiResult: "",
    chatMessages: [],
    chatInput: ""
  };

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function relTime(ts) {
    var diff = Date.now() - ts, min = Math.floor(diff / 60000);
    if (min < 1) return "justo ahora";
    if (min < 60) return "hace " + min + " min";
    var hrs = Math.floor(min / 60);
    if (hrs < 24) return "hace " + hrs + " h";
    return "hace " + Math.floor(hrs / 24) + " d";
  }
  function extractTags(content) {
    var m = content.match(/#([a-zA-Z0-9_\-áéíóúñÁÉÍÓÚÑ]+)/g) || [];
    var seen = {}, out = [];
    m.forEach(function (t) { var v = t.slice(1).toLowerCase(); if (!seen[v]) { seen[v] = true; out.push(v); } });
    return out.sort();
  }
  function extractWikilinks(content) {
    var re = /\[\[([^\]]+)\]\]/g, m, seen = {}, out = [];
    while ((m = re.exec(content)) !== null) {
      var t = m[1].trim();
      var k = t.toLowerCase();
      if (!seen[k]) { seen[k] = true; out.push(t); }
    }
    return out;
  }

  /* ---------- markdown ---------- */
  function parseInlineHTML(text, notes) {
    var regex = /(\[\[([^\]]+)\]\])|(!\[([^\]]*)\]\(([^)]+)\))|(\*\*([^*]+)\*\*)|(`([^`]+)`)|(\[([^\]]+)\]\(([^)]+)\))|(#([a-zA-Z0-9_\-áéíóúñÁÉÍÓÚÑ]+))|(\*([^*]+)\*)/g;
    var lastIndex = 0, m, out = "";
    while ((m = regex.exec(text)) !== null) {
      if (m.index > lastIndex) out += esc(text.slice(lastIndex, m.index));
      if (m[1]) {
        var title = m[2].trim();
        var exists = notes.some(function (n) { return n.title.toLowerCase() === title.toLowerCase(); });
        out += '<span class="' + (exists ? "md-wikilink" : "md-wikilink-new") + '" data-action="navigate" data-title="' + esc(title) + '">' + esc(title) + "</span>";
      } else if (m[3]) {
        out += '<img src="' + esc(m[5]) + '" alt="' + esc(m[4] || "") + '" class="md-inline-img" />';
      } else if (m[6]) {
        out += "<strong>" + esc(m[7]) + "</strong>";
      } else if (m[8]) {
        out += '<code class="md-inline-code">' + esc(m[9]) + "</code>";
      } else if (m[10]) {
        out += '<a href="' + esc(m[12]) + '" target="_blank" rel="noreferrer" class="md-link">' + esc(m[11]) + "</a>";
      } else if (m[13]) {
        out += '<span class="md-tag">#' + esc(m[14]) + "</span>";
      } else if (m[15]) {
        out += "<em>" + esc(m[16]) + "</em>";
      }
      lastIndex = regex.lastIndex;
    }
    if (lastIndex < text.length) out += esc(text.slice(lastIndex));
    return out;
  }

  function getYoutubeId(url) {
    var m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{6,})/);
    return m ? m[1] : null;
  }
  function isImageUrl(url) { return /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(url); }
  function isSlidesUrl(url) { return /docs\.google\.com\/presentation/.test(url) || /speakerdeck\.com/.test(url) || /canva\.com\/design/.test(url); }

  function renderSmartEmbedHTML(url) {
    var yt = getYoutubeId(url);
    if (yt) return '<div class="md-embed-media"><iframe src="https://www.youtube.com/embed/' + esc(yt) + '" allowfullscreen></iframe></div>';
    if (isSlidesUrl(url)) {
      var embedUrl = /\/embed/.test(url) ? url : url.replace(/\/(edit|present)\S*$/, "/embed");
      return '<div class="md-embed-media"><iframe src="' + esc(embedUrl) + '" allowfullscreen></iframe></div>';
    }
    if (isImageUrl(url)) return '<img src="' + esc(url) + '" alt="" class="md-block-img" />';
    var hostname = url;
    try { hostname = new URL(url).hostname.replace(/^www\./, ""); } catch (e) {}
    return '<a href="' + esc(url) + '" target="_blank" rel="noreferrer" class="md-link-card"><span class="md-link-card-host">' + esc(hostname) + '</span><span class="md-link-card-url">' + esc(url) + "</span></a>";
  }

  function renderMarkdownHTML(content, notes, depth, ownerId) {
    var d = depth || 0;
    var lines = content.split("\n");
    var html = "", i = 0;
    while (i < lines.length) {
      var line = lines[i];

      if (line.trim().indexOf("```") === 0) {
        var codeLines = []; i++;
        while (i < lines.length && lines[i].trim().indexOf("```") !== 0) { codeLines.push(lines[i]); i++; }
        i++;
        html += '<pre class="md-code-block"><code>' + esc(codeLines.join("\n")) + "</code></pre>";
        continue;
      }

      var embedMatch = line.trim().match(/^!\[\[([^\]]+)\]\]$/);
      if (embedMatch) {
        var targetTitle = embedMatch[1].trim();
        var targetNote = notes.find(function (n) { return n.title.toLowerCase() === targetTitle.toLowerCase(); });
        var body;
        if (!targetNote) body = '<span class="assist-muted">Esta nota todavía no existe. Toca el título para crearla.</span>';
        else if (d >= 1) body = '<span class="assist-muted">(nota incrustada dentro de otra, no se expande más)</span>';
        else if (targetNote.content.trim()) body = renderMarkdownHTML(targetNote.content, notes, d + 1, targetNote.id);
        else body = '<span class="assist-muted">Nota vacía.</span>';
        html += '<div class="md-embed"><div class="md-embed-title" data-action="navigate" data-title="' + esc(targetTitle) + '">' + esc(targetTitle) + '</div><div class="md-embed-body">' + body + "</div></div>";
        i++; continue;
      }

      var urlMatch = line.trim().match(/^(https?:\/\/\S+)$/);
      if (urlMatch) { html += renderSmartEmbedHTML(urlMatch[1]); i++; continue; }

      if (/^#{1,4}\s/.test(line)) {
        var level = line.match(/^#+/)[0].length;
        var text = line.replace(/^#{1,4}\s/, "");
        var tag = "h" + Math.min(level + 1, 6);
        html += "<" + tag + ' class="md-h' + level + '">' + parseInlineHTML(text, notes) + "</" + tag + ">";
        i++; continue;
      }

      if (/^>\s?/.test(line)) {
        var qLines = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { qLines.push(lines[i].replace(/^>\s?/, "")); i++; }
        html += '<blockquote class="md-quote">' + qLines.map(function (l) { return "<p>" + parseInlineHTML(l, notes) + "</p>"; }).join("") + "</blockquote>";
        continue;
      }

      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { html += '<hr class="md-hr" />'; i++; continue; }

      if (/^\s*[-*]\s\[[ xX]\]\s/.test(line)) {
        var todoItems = [];
        while (i < lines.length && /^\s*[-*]\s\[[ xX]\]\s/.test(lines[i])) {
          var tm = lines[i].match(/^\s*[-*]\s\[([ xX])\]\s(.*)$/);
          todoItems.push({ checked: tm[1].toLowerCase() === "x", text: tm[2], lineIndex: i });
          i++;
        }
        html += '<ul class="md-ul md-todo-list">' + todoItems.map(function (it) {
          return '<li class="md-todo-item"><span class="md-todo-check" data-action="toggle-todo" data-owner="' + esc(ownerId || "") + '" data-line="' + it.lineIndex + '">' + (it.checked ? "☑" : "☐") + '</span><span class="' + (it.checked ? "md-todo-done" : "") + '">' + parseInlineHTML(it.text, notes) + "</span></li>";
        }).join("") + "</ul>";
        continue;
      }

      if (/^\s*[-*]\s/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s/, "")); i++; }
        html += '<ul class="md-ul">' + items.map(function (it) { return "<li>" + parseInlineHTML(it, notes) + "</li>"; }).join("") + "</ul>";
        continue;
      }

      if (/^\s*\d+\.\s/.test(line)) {
        var oitems = [];
        while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) { oitems.push(lines[i].replace(/^\s*\d+\.\s/, "")); i++; }
        html += '<ol class="md-ol">' + oitems.map(function (it) { return "<li>" + parseInlineHTML(it, notes) + "</li>"; }).join("") + "</ol>";
        continue;
      }

      if (line.trim() === "") { i++; continue; }

      var pLines = [line]; i++;
      while (
        i < lines.length && lines[i].trim() !== "" &&
        !/^#{1,4}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) &&
        !/^\s*[-*]\s/.test(lines[i]) && !/^\s*\d+\.\s/.test(lines[i]) &&
        lines[i].trim().indexOf("```") !== 0 &&
        !/^!\[\[([^\]]+)\]\]$/.test(lines[i].trim()) &&
        !/^(https?:\/\/\S+)$/.test(lines[i].trim())
      ) { pLines.push(lines[i]); i++; }
      html += '<p class="md-p">' + parseInlineHTML(pLines.join(" "), notes) + "</p>";
    }
    return html;
  }

  /* ---------- storage ---------- */
  function loadNotes() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }
  function saveNotes() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes)); } catch (e) {} }
  function loadAi() {
    try {
      var raw = localStorage.getItem(AI_KEY);
      if (raw) { var parsed = JSON.parse(raw); state.ai.localUrl = parsed.localUrl || state.ai.localUrl; state.ai.localModel = parsed.localModel || state.ai.localModel; }
    } catch (e) {}
  }
  function saveAi() { try { localStorage.setItem(AI_KEY, JSON.stringify(state.ai)); } catch (e) {} }

  function makeWelcomeNotes() {
    var id1 = uid(), id2 = uid(), id3 = uid();
    return [
      { id: id1, title: "Bienvenida", parentId: null, icon: "🧠",
        content: "# Tu segundo cerebro (100% local)\n\nEste archivo no depende de ningún servidor ni cuenta. Todo se guarda en este navegador.\n\n- `[[Nota]]` enlaza a otra nota\n- `![[Nota]]` incrusta el contenido completo de otra, como abajo\n- Escribí `/` al inicio de una línea para insertar un bloque (encabezado, tarea, cita, etc.)\n- Un enlace de YouTube en su propia línea se convierte en video\n- Cada nota tiene subpáginas (como esta) y un enlace directo propio\n\n- [ ] Probar el comando `/`\n- [ ] Crear una subpágina con el botón +\n\n![[Zettelkasten]]",
        createdAt: Date.now() - 60000, updatedAt: Date.now() - 60000 },
      { id: id2, title: "Zettelkasten", parentId: id1, icon: "🔗",
        content: "Un #metodo de notas atómicas y enlazadas. Esta nota es subpágina de [[Bienvenida]] y también está incrustada dentro de ella.\n\nUsá el botón 🔗 para copiar el enlace directo a esta nota, o 📋 para copiarla como Markdown y pegarla en tu IA local o en NotebookLM.",
        createdAt: Date.now() - 45000, updatedAt: Date.now() - 45000 },
      { id: id3, title: "Ejemplo de subpágina", parentId: id2, icon: "📎",
        content: "Esta nota está dos niveles adentro. Mirá el breadcrumb de arriba para volver a las notas anteriores.\n\nEl botón de copia de seguridad (💾, arriba a la izquierda) también exporta todo el vault como un único archivo .md.",
        createdAt: Date.now() - 30000, updatedAt: Date.now() - 30000 }
    ];
  }

  function sanitizeNotes() {
    var ids = {};
    state.notes.forEach(function (n) { ids[n.id] = true; });
    state.notes.forEach(function (n) {
      if (n.parentId && !ids[n.parentId]) n.parentId = null;
      if (n.parentId === undefined) n.parentId = null;
      if (!n.icon) n.icon = "📄";
    });
  }

  function updateHash(id) {
    try {
      if (id) history.replaceState(null, "", "#/note/" + encodeURIComponent(id));
      else history.replaceState(null, "", location.pathname + location.search);
    } catch (e) {}
  }

  function handleHashChange() {
    var m = location.hash.match(/^#\/note\/(.+)$/);
    if (m) {
      var id = decodeURIComponent(m[1]);
      if (id !== state.activeId && state.notes.some(function (n) { return n.id === id; })) {
        state.activeId = id;
        state.assistantOpen = false;
        if (state.isMobile) state.mobileTab = "editor";
        render();
      }
    }
  }

  function init() {
    var loaded = loadNotes();
    state.notes = loaded && loaded.length ? loaded : makeWelcomeNotes();
    sanitizeNotes();
    var hashMatch = location.hash.match(/^#\/note\/(.+)$/);
    var hashId = hashMatch ? decodeURIComponent(hashMatch[1]) : null;
    state.activeId = hashId && state.notes.some(function (n) { return n.id === hashId; }) ? hashId : (state.notes.length ? state.notes[0].id : null);
    loadAi();
    window.addEventListener("resize", function () {
      var was = state.isMobile;
      state.isMobile = window.innerWidth < 760;
      if (was !== state.isMobile) render();
    });
    window.addEventListener("hashchange", handleHashChange);
    render();
  }

  /* ---------- derived data ---------- */
  function getActiveNote() {
    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].id === state.activeId) return state.notes[i];
    return null;
  }
  function getAllTags() {
    var set = {};
    state.notes.forEach(function (n) { extractTags(n.content).forEach(function (t) { set[t] = true; }); });
    return Object.keys(set).sort();
  }
  function getFilteredNotes() {
    var list = state.notes.slice();
    if (state.tagFilter) list = list.filter(function (n) { return extractTags(n.content).indexOf(state.tagFilter) !== -1; });
    if (state.query.trim()) {
      var q = state.query.toLowerCase();
      list = list.filter(function (n) { return n.title.toLowerCase().indexOf(q) !== -1 || n.content.toLowerCase().indexOf(q) !== -1; });
    }
    list.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    return list;
  }
  function getBacklinks(note) {
    if (!note) return [];
    return state.notes.filter(function (n) {
      return n.id !== note.id && extractWikilinks(n.content).some(function (t) { return t.toLowerCase() === note.title.toLowerCase(); });
    });
  }

  /* ---------- actions ---------- */
  function createNote(initialTitle, parentId) {
    var now = Date.now();
    var note = { id: uid(), title: (initialTitle && initialTitle.trim()) || "Nota sin título", content: "", parentId: parentId || null, icon: "📄", createdAt: now, updatedAt: now };
    state.notes.unshift(note);
    state.activeId = note.id;
    state.viewMode = "edit";
    state.assistantOpen = false;
    if (parentId) state.expandedIds[parentId] = true;
    if (state.isMobile) state.mobileTab = "editor";
    saveNotes();
    updateHash(note.id);
    render();
  }
  function navigateToNote(title) {
    var existing = state.notes.find(function (n) { return n.title.toLowerCase() === title.toLowerCase(); });
    if (existing) {
      state.activeId = existing.id;
      state.assistantOpen = false;
      if (state.isMobile) state.mobileTab = "editor";
      updateHash(existing.id);
      render();
    } else {
      createNote(title);
    }
  }
  function selectNote(id) {
    state.activeId = id;
    state.assistantOpen = false;
    if (state.isMobile) state.mobileTab = "editor";
    updateHash(id);
    render();
  }
  function deleteNote(id) {
    var deleted = state.notes.find(function (n) { return n.id === id; });
    var newParent = deleted ? deleted.parentId : null;
    state.notes.forEach(function (n) { if (n.parentId === id) n.parentId = newParent; });
    state.notes = state.notes.filter(function (n) { return n.id !== id; });
    if (state.activeId === id) {
      state.activeId = state.notes.length ? state.notes[0].id : null;
      updateHash(state.activeId);
    }
    state.confirmDeleteId = null;
    saveNotes();
    render();
  }

  function insertTemplate(before, placeholder, after, blockLevel) {
    var note = getActiveNote();
    if (!note) return;
    state.viewMode = "edit";
    state.showInsertMenu = false;
    var ta = document.getElementById("content-textarea");
    var content = note.content;
    var start = ta ? ta.selectionStart : content.length;
    var end = ta ? ta.selectionEnd : content.length;
    var prefix = "", suffix = "";
    if (blockLevel) {
      prefix = start > 0 && content[start - 1] !== "\n" ? "\n\n" : "";
      suffix = end < content.length && content[end] !== "\n" ? "\n\n" : "";
    }
    var insertText = before + placeholder + after;
    var newContent = content.slice(0, start) + prefix + insertText + suffix + content.slice(end);
    note.content = newContent;
    note.updatedAt = Date.now();
    saveNotes();
    render();
    requestAnimationFrame(function () {
      var t = document.getElementById("content-textarea");
      if (t) {
        t.focus();
        var selStart = start + prefix.length + before.length;
        t.setSelectionRange(selStart, selStart + placeholder.length);
      }
    });
  }

  var SLASH_OPTIONS = [
    { key: "h1", label: "Encabezado 1" },
    { key: "h2", label: "Encabezado 2" },
    { key: "h3", label: "Encabezado 3" },
    { key: "bullet", label: "Lista" },
    { key: "numbered", label: "Lista numerada" },
    { key: "todo", label: "Tarea" },
    { key: "quote", label: "Cita" },
    { key: "code", label: "Código" },
    { key: "divider", label: "Divisor" },
    { key: "link", label: "Enlace a nota" },
    { key: "embed", label: "Nota incrustada" },
